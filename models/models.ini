; The models the models backend draws in place of the game's flat figures (task 102, D-025; docs/ge-backend.md,
; "The models backend"). Read at start and whenever the Video tab's Crowds and people row is set to Models.
;
; [figures]: <texture key> = <file>.pmdl figures=<n> [clip=<name>]
;   the key    the HD pack's key of the figure's texture (its textures.ini's rule: xxh64, the address ignored, the
;              mip levels ignored), 24 hex digits
;   the file   a model in this folder, made by tools/model_import.py (models/README.md)
;   figures    how many figures stand on each quad of a draw with that texture (1 for the pit marshal)
;   clip       an animated (version 2) model's clip to play, by name (task 103; default the first in the file)
; or, for a crowd (task 104): <texture key> = set=<name> spacing=<units> [near=<units> far=<units>] [tint=0|1]
;   set        a [set <name>] section below: the figure of each place is picked from its files by a hash of the place
;   spacing    the room a figure takes along the quad: max(1, round(width / spacing)) figures on a quad
;   near, far  units from the eye to the quad's base: every figure nearer than near, every second one between near
;              and far, every fourth beyond far (default 120 and 300)
;   tint       1 (the default): the quad's vertex tint multiplies the figures' colours, as for the marshal; 0: not
; [set <name>]: the set's files, one a line (a model in this folder), in the order the hash picks from.
; or, for a sky face (task 106, D-026): <texture key> = sky=<name>
;   sky        a [sky <name>] section below: the first of a frame's faces mapped to it draws the sky's layers at the
;              sky cube's centre (with the Skies row at Models), and every face mapped to a sky is dropped
; [sky <name>]: the sky's layers, one a line, drawn in that order: <file>.pmdl [parallax=<f>] [spin=<degrees/s>]
;   the file   a layer in the sky's space (models/README.md, "Skies"), imported with --as-is --no-light
;   parallax   the layer slides by -f x the eye's world x and z (wrapped to the cube's 100 units); default 0
;   spin       the layer turns about y at this many degrees a second; default 0
; Everything after ; or # on a line is a comment.

[figures]
